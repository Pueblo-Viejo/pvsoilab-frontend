<div>
  <app-page-breadcrumb pageTitle="Legacy System" />

  <div class="space-y-6">
    @for (group of groups; track group.title) {
    <section class="space-y-4">
      <div>
        <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
          {{ group.title }}
        </h3>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4">
        @for (option of group.options; track option.path) {
        <a
          [href]="legacyUrl(option.path)"
          class="group block rounded-lg border border-gray-200 bg-white p-5 shadow-theme-xs transition hover:-translate-y-0.5 hover:border-brand-300 hover:shadow-theme-sm dark:border-gray-800 dark:bg-white/[0.03] dark:hover:border-brand-500/60"
        >
          <div class="mb-4 flex items-start justify-between gap-4">
            <div class="flex size-10 items-center justify-center rounded-lg bg-gray-100 text-gray-600 transition group-hover:bg-brand-50 group-hover:text-brand-600 dark:bg-white/[0.05] dark:text-gray-400 dark:group-hover:bg-brand-500/15 dark:group-hover:text-brand-400">
              <svg class="size-5" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M8.75 5.75H6.5C5.67157 5.75 5 6.42157 5 7.25V17.5C5 18.3284 5.67157 19 6.5 19H16.75C17.5784 19 18.25 18.3284 18.25 17.5V15.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M13.25 5H19V10.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M11.5 12.5L18.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
            <span class="rounded-full bg-gray-100 px-2.5 py-1 text-xs font-medium text-gray-500 dark:bg-white/[0.05] dark:text-gray-400">
              Legacy
            </span>
          </div>

          <h4 class="text-base font-semibold text-gray-800 dark:text-white/90">
            {{ option.title }}
          </h4>
          <p class="mt-2 min-h-10 text-sm text-gray-500 dark:text-gray-400">
            {{ option.description }}
          </p>
        </a>
        }
      </div>
    </section>
    }
  </div>
</div>
