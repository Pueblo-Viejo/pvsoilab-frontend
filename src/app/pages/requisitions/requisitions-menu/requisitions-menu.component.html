<div>
  <app-page-breadcrumb pageTitle="Requisiciones" />

  <section class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3">
    @for (option of options; track option.title) {
      @if (option.path) {
        <a
          [routerLink]="option.path"
          class="group block rounded-lg border border-gray-200 bg-white p-5 shadow-theme-xs transition hover:-translate-y-0.5 hover:border-brand-300 hover:shadow-theme-sm dark:border-gray-800 dark:bg-white/[0.03] dark:hover:border-brand-500/60"
        >
          <ng-container *ngTemplateOutlet="cardContent; context: { option: option }" />
        </a>
      } @else if (option.legacyPath) {
        <a
          [href]="legacyUrl(option.legacyPath)"
          class="group block rounded-lg border border-gray-200 bg-white p-5 shadow-theme-xs transition hover:-translate-y-0.5 hover:border-brand-300 hover:shadow-theme-sm dark:border-gray-800 dark:bg-white/[0.03] dark:hover:border-brand-500/60"
        >
          <ng-container *ngTemplateOutlet="cardContent; context: { option: option }" />
        </a>
      }
    }
  </section>

  <ng-template #cardContent let-option="option">
    <div class="mb-4 flex items-start justify-between gap-4">
      <div class="flex size-10 items-center justify-center rounded-lg bg-gray-100 text-gray-600 transition group-hover:bg-brand-50 group-hover:text-brand-600 dark:bg-white/[0.05] dark:text-gray-400 dark:group-hover:bg-brand-500/15 dark:group-hover:text-brand-400">
        <svg class="size-5" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <path [attr.d]="option.icon" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      @if (option.tag === 'Legacy') {
        <span class="rounded-full bg-gray-100 px-2.5 py-1 text-xs font-medium text-gray-500 dark:bg-white/[0.05] dark:text-gray-400">
          Legacy
        </span>
      }
    </div>

    <h3 class="text-base font-semibold text-gray-800 dark:text-white/90">
      {{ option.title }}
    </h3>
    <p class="mt-2 min-h-10 text-sm text-gray-500 dark:text-gray-400">
      {{ option.description }}
    </p>
  </ng-template>
</div>
